
#-----------------------------------------------------------------------


monitor = eDP-1, 1920x1080@144, 0x0, 1


$terminal =kitty
$fileManager = nemo
#$menu = walker
$menu = rofi -show drun
$browser = firefox
$ai = $browser --new-window https://chat.openai.com
$jupyter = jupyter lab 
$reload_waybar = pkill waybar; waybar &

master {
  #  new_status = master
}

misc {
    force_default_wallpaper =  1
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############


# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ara 
}



animations {
    enabled = false
}
# -----------------------------------------------------
# General window decoration
# name: "Rounding All Blur No Shadows"
# -----------------------------------------------------

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }

    shadow {
        enabled = true
        range = 32
        render_power = 2
        color = rgba(00000050)
    }
}

# -----------------------------------------------------
# General window layout and colors
# name: "Default"
# -----------------------------------------------------

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(00000050)
    col.inactive_border = rgba(1a110fff)
    layout = dwindle
    resize_on_border = true
}

#------------------------Auto start-----------------
exec-once = waybar & hyprpaper & hypridle  & $terminal
#---------------------------------------------------
#------------------------keyword--------------------


# Sets "Windows" key as main modifier
$mainMod = SUPER
bindl = ALT, Shift_L, exec, hyprctl switchxkblayout main next 
gesture = 3, horizontal, workspace
#gesture = 3, down, exec, $zoom_out
# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magicgesture = 3, horizontal, workspaceg
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, RETURN, exec, $terminal 
bind = $mainMod, B, exec, $browser
bind = $mainMod, A, exec, $ai
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $reload_waybar

bind = $mainMod, space, exec, $menu
bind = $mainMod, Q, killactive,
bind = $mainMod CTRL, Q, exec, wlogout
bind = $mainMod, T, togglefloating,
bind = $mainMod, P, pseudo, # dwindle

bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # Increase display zoom
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # Decrease display zoom
bind = $mainMod ALT, Z, exec, hyprctl keyword cursor:zoom_factor 1 # Reset display zoom


bind = $mainMod, F, fullscreen, 0                                                              # Set active window to fullscreen

bind = $mainMod, M, fullscreen, 1                                                           # Maximize Window
binde = ALT,Tab,cyclenext                                                                   # Cycle between windows
binde = ALT,Tab,bringactivetotop                                                            # Bring active window to the top
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r

bind = $mainMod, l, exec, hyprlock
unbind = SUPER, M, exec, exit
bind = SUPER, M, exec, hyprlock

bind = $mainMod, J, togglesplit                                                             # Toggle split

bindm = $mainMod, mouse:272, movewindow                                                     # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow                                                   # Resize window with the mouse

bind = $mainMod, Tab, workspace, m+1       # Open next workspace
bind = $mainMod SHIFT, Tab, workspace, m-1 # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty # Open the next empty workspace
#---------------------------------------------------





# ───────────────────────────────
# Keybinds for workspace switching
# ───────────────────────────────

# AZERTY top row (1–0)

monitor=HDMI-A-3,1920x1080@60, 0x0, 1
monitor=DP-1, 1920x1080@60, 1920x0, 1


bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3,  workspace, 3
bind = $mainMod, 4,workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6,     workspace, 6
bind = $mainMod, 7,    workspace, 7
bind = $mainMod, 8,workspace, 8
bind = $mainMod, 9,  workspace, 9
bind = $mainMod, 0,    workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2,    movetoworkspace, 2
bind = $mainMod SHIFT, 3,  movetoworkspace, 3
bind = $mainMod SHIFT, 4,movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6,     movetoworkspace, 6
bind = $mainMod SHIFT, 7,    movetoworkspace, 7
bind = $mainMod SHIFT, 8,movetoworkspace, 8
bind = $mainMod SHIFT, 9,  movetoworkspace, 9
bind = $mainMod SHIFT, 0,    movetoworkspace, 10

# Keypad (1–0)
bind = $mainMod, KP_End,   workspace, 1
bind = $mainMod, KP_Down,  workspace, 2
bind = $mainMod, KP_Next,  workspace, 3
bind = $mainMod, KP_Left,  workspace, 4
bind = $mainMod, KP_Begin, workspace, 5
bind = $mainMod, KP_Right, workspace, 6
bind = $mainMod, KP_Home,  workspace, 7
bind = $mainMod, KP_Up,    workspace, 8
bind = $mainMod, KP_Prior, workspace, 9
bind = $mainMod, KP_Insert,workspace, 10
bind = $mainMod, KP_Delete,workspace, 0

bind = $mainMod SHIFT, KP_End,   movetoworkspace, 1
bind = $mainMod SHIFT, KP_Down,  movetoworkspace, 2
bind = $mainMod SHIFT, KP_Next,  movetoworkspace, 3
bind = $mainMod SHIFT, KP_Left,  movetoworkspace, 4
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 5
bind = $mainMod SHIFT, KP_Right, movetoworkspace, 6
bind = $mainMod SHIFT, KP_Home,  movetoworkspace, 7
bind = $mainMod SHIFT, KP_Up,    movetoworkspace, 8
bind = $mainMod SHIFT, KP_Prior, movetoworkspace, 9
bind = $mainMod SHIFT, KP_Insert,movetoworkspace, 10
bind = $mainMod SHIFT, KP_Delete,movetoworkspace, 0


# ───────────────────────────────
# Workspace to monitor assignment
# ───────────────────────────────

# HDMI-A-3 → even workspaces (0,2,4,6,8)
workspace = 7, monitor:HDMI-A-3, default:true
workspace = 8, monitor:HDMI-A-3
workspace = 9, monitor:HDMI-A-3

# DP-1 → odd workspaces (1,3,5,7,9)
workspace = 0, monitor:DP-1, default:true
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1


# ───────────────────────────────
# Window rules
# ───────────────────────────────

windowrule = match:title ^(pavucontrol)$ ,float  on
windowrule = match:title ^(blueman-manager)$, float on
windowrule = match:title ^(nm-connection-editor)$,float on
windowrule = match:title ^(qalculate-gtk)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ModernGL,workspace 9, border_size 10
